name: 'Publish to Maven Central with Nmcp'
description: 'Sign and publish the Android libraries as one deployment'
inputs:
  gpg-private-key:
    description: GPG private key for signing the published artifacts
    required: true
  gpg-passphrase:
    description: Passphrase for the GPG key
    required: true
  maven-central-username:
    description: Maven Central Portal user token username
    required: true
  maven-central-password:
    description: Maven Central Portal user token password
    required: true

runs:
  using: "composite"
  steps:
    - name: Publish artifacts
      run: ./gradlew publishAggregationToCentralPortal
      shell: bash
      env:
        ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ inputs.maven-central-username }}
        ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ inputs.maven-central-password }}
        ORG_GRADLE_PROJECT_signingPassword: ${{ inputs.gpg-passphrase }}
        ORG_GRADLE_PROJECT_signingKey: ${{ inputs.gpg-private-key }}

branding:
  icon: package
  color: green
