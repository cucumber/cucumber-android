name: Run android tests
description: Runs cukeulator android tests

inputs:
  api-level:
    description: Android API level used for the emulator
    required: false
    default: '30'

runs:
  using: composite
  steps:
    - name: run tests
      uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
      with:
        api-level: ${{ inputs.api-level }}
        arch: x86_64
        emulator-options: -skin 1920x1080 -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
        script: ./gradlew :cukeulator:connectedCheck -PdisableAnimations=true
    - name: Upload Test Reports On Failure
      if: failure()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
         name: android-test-reports
         path: |
            **/build/reports/androidTests/connected/
            **/build/outputs/androidTest-results/
