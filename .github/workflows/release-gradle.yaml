name: Release cucumber-android

permissions: { }

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    name: Publish cucumber-android
    runs-on: macos-26-intel
    environment: Release

    steps:
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check commit has been pushed on origin/main
        run: |
          git fetch --quiet origin main
          git merge-base --is-ancestor HEAD origin/main
      - name: Build the app
        run: ./gradlew build --stacktrace -x lint
      - name: run tests
        uses: $/.github/actions/android-test
      - name: Publish
        uses: $/.github/actions/action-publish-gradle
        with:
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: ${{ secrets.GPG_PASSPHRASE }}
          maven-central-username: ${{ secrets.SONATYPE_USERNAME }}
          maven-central-password: ${{ secrets.SONATYPE_PASSWORD }}
