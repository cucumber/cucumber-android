name: Build

permissions: { }

on:
  # Trigger on every pull request and on push
  # to the `main` and `renovate/**` branch.
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
      - renovate/**

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Build the app
        run: ./gradlew build --stacktrace -x lint
      - name: run tests
        uses: $/.github/actions/android-test

