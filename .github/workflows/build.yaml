name: Build

permissions: { }

on:
  # Trigger on every pull request and on push
  # to the `main` and `renovate/**` branch.
  pull_request:
    branches:
      - '**'
  push:
    branches:
      - main
      - renovate/**

jobs:
  build:
    runs-on: macos-26-intel
    steps:
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Checkout the code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Gradle cache
        uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Build the app
        run: ./gradlew build --stacktrace -x lint
      - name: run tests
        uses: $/.github/actions/android-test

