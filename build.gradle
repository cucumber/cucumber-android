plugins {
    alias(libs.plugins.nmcp.aggregation)
    alias(libs.plugins.kotlin.android) apply false
    alias(libs.plugins.android.application) apply false
    alias(libs.plugins.android.library) apply false
}

ext {
    targetSdkVersion = 37
    minSdkVersion = '14'
}

allprojects {
    version = "7.20.0-SNAPSHOT"
    group = 'io.cucumber'
}

nmcpAggregation {
    centralPortal {
        username.set(providers.gradleProperty('mavenCentralUsername'))
        password.set(providers.gradleProperty('mavenCentralPassword'))
        publishingType = 'AUTOMATIC'
    }
}

dependencies {
    nmcpAggregation(project(':cucumber-android'))
    nmcpAggregation(project(':cucumber-android-hilt'))
    nmcpAggregation(project(':cucumber-junit-rules-support'))
}
